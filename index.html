<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopKeep Live Checklist</title>
  <link rel="stylesheet" href="web/styles.css?v=11" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">SK</div>
      <div>
        <h1>ShopKeep Live</h1>
        <p class="subtitle">Real-time shop checklist — open public access</p>
      </div>
    </div>
    <div class="auth-controls">
      <span id="accessBadge" class="access-pill">Public Live Access</span>
      <button id="signInBtn" class="btn btn-primary hidden">Sign in with Google to Edit</button>
      <button id="signOutBtn" class="btn btn-outline hidden">Sign out</button>
    </div>
  </header>

  <main class="container">
    <section id="boardSection" class="card hidden">
      <div class="board-header">
        <div>
          <h2 id="boardTitle">Shop Stock Checklist</h2>
          <p id="boardMeta" class="subtitle"></p>
        </div>
        <span id="liveBadge" class="badge-live">LIVE SYNC</span>
      </div>

      <div id="boardSwitcherBar" class="board-switcher-bar hidden">
        <label for="boardSelect" class="board-select-label">Board</label>
        <select id="boardSelect" class="board-select" aria-label="Switch live board"></select>
      </div>

      <div id="viewToolbar" class="view-toolbar">
        <div class="segmented-control" role="tablist" aria-label="Layout mode">
          <button id="viewCategoriesBtn" type="button" class="seg-btn active" data-mode="categories">By Category Grid</button>
          <button id="viewAllGridBtn" type="button" class="seg-btn" data-mode="all-grid">All Photos Grid</button>
        </div>
        <div class="grid-density-control" role="group" aria-label="Grid columns">
          <button id="densityStandardBtn" type="button" class="density-btn active" data-density="standard" title="Balanced grid">2–4 Col</button>
          <button id="densityCompactBtn" type="button" class="density-btn" data-density="compact" title="Compact dense grid">3–5 Col</button>
        </div>
      </div>

      <div id="categoryFilterBar" class="category-filter-bar hidden" aria-label="Filter by category"></div>

      <form id="addItemForm" class="add-item-form hidden">
        <input id="itemTitleInput" type="text" placeholder="Add stock item or photo title..." />
        <input id="itemQtyInput" type="text" placeholder="Qty (e.g. 2 crates)" />
        <input id="itemCatInput" type="text" placeholder="Category" value="Supplies" />
        <input id="itemPhotoInput" type="file" accept="image/*" multiple class="hidden" />
        <button id="attachPhotoBtn" type="button" class="btn btn-secondary">📷 Photo(s)</button>
        <button type="submit" class="btn btn-primary">Add</button>
        <div id="draftPhotoPreview" class="draft-photo-preview hidden">
          <img id="draftPhotoImg" alt="Draft photo preview" />
          <span id="draftPhotoLabel" class="subtitle">Photo attached</span>
          <button id="clearDraftPhotoBtn" type="button" class="btn-icon" title="Remove attached photo">×</button>
        </div>
      </form>

      <div id="categoriesContainer" class="categories-grid"></div>
    </section>

    <section id="emptyState" class="card empty-state">
      <h2 id="emptyTitle">Loading ShopKeep Live...</h2>
      <p id="emptyDesc">Connecting to real-time shop checklist...</p>
    </section>

    <details class="card switch-details">
      <summary>Open another board by code (optional)</summary>
      <div class="join-bar">
        <input id="codeInput" type="text" placeholder="Optional board code (e.g. SHOP-A1B2C3)" />
        <button id="openCodeBtn" class="btn btn-primary" type="button">Open Board</button>
      </div>
    </details>
  </main>

  <div id="photoLightbox" class="photo-lightbox hidden" role="dialog" aria-modal="true">
    <div class="photo-lightbox-content">
      <img id="lightboxImg" alt="Photo Note preview" />
      <div class="photo-lightbox-bar">
        <span id="lightboxTitle">Photo Note</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="toggleLightboxBtn" type="button" class="btn btn-secondary hidden">Mark</button>
          <button id="closeLightboxBtn" type="button" class="btn btn-primary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="web/app.js?v=11"></script>
</body>
</html>
