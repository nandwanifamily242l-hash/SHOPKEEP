<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopKeep Live Checklist</title>
  <link rel="stylesheet" href="web/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">SK</div>
      <div>
        <h1>ShopKeep Live</h1>
        <p class="subtitle">Real-time shop checklist — open public access</p>
      </div>
    </div>
    <div class="auth-controls">
      <span id="accessBadge" class="access-pill">Public Live Access</span>
      <button id="signInBtn" class="btn btn-primary hidden">Sign in with Google to Edit</button>
      <button id="signOutBtn" class="btn btn-outline hidden">Sign out</button>
    </div>
  </header>

  <main class="container">
    <section id="boardSection" class="card hidden">
      <div class="board-header">
        <div>
          <h2 id="boardTitle">Shop Stock Checklist</h2>
          <p id="boardMeta" class="subtitle"></p>
        </div>
        <span id="liveBadge" class="badge-live">LIVE SYNC</span>
      </div>

      <form id="addItemForm" class="add-item-form hidden">
        <input id="itemTitleInput" type="text" placeholder="Add stock item..." required />
        <input id="itemQtyInput" type="text" placeholder="Qty (e.g. 2 crates)" />
        <input id="itemCatInput" type="text" placeholder="Category" value="Supplies" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div id="categoriesContainer" class="categories-grid"></div>
    </section>

    <section id="emptyState" class="card empty-state">
      <h2 id="emptyTitle">Loading ShopKeep Live...</h2>
      <p id="emptyDesc">Connecting to real-time shop checklist...</p>
    </section>

    <details class="card switch-details">
      <summary>Switch to a different board code (optional)</summary>
      <div class="join-bar">
        <input id="codeInput" type="text" placeholder="Optional board code (e.g. SHOP-A1B2C3)" />
        <button id="openCodeBtn" class="btn btn-primary" type="button">Open Board</button>
      </div>
    </details>
  </main>

  <script type="module" src="web/app.js"></script>
</body>
</html>
